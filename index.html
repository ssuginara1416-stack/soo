<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수남매 부자되기</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #e5e7eb; 
            touch-action: pan-y; /* Optimize for mobile touch */
        }
        .app-container { 
            height: 100dvh; 
            max-height: 100dvh; 
        }
        /* Mobile-first layout simulating app on desktop */
        @media (min-width: 640px) {
            .app-container { 
                height: 850px; 
                max-height: 850px; 
                border-radius: 1.5rem; 
                margin-top: 2rem; 
                margin-bottom: 2rem; 
            }
        }
        
        /* Hide scrollbar for clean UI */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- App Container -->
    <div id="app" class="app-container max-w-md mx-auto bg-gray-50 flex flex-col relative shadow-2xl overflow-hidden">
        <!-- Initial Loading Screen -->
        <div id="loadingScreen" class="flex-1 flex flex-col items-center justify-center bg-indigo-600 text-white z-50 absolute inset-0">
            <div class="loader mb-4"></div>
            <h2 class="text-xl font-bold">클라우드 동기화 중...</h2>
            <p class="text-indigo-200 text-sm mt-2">가족 데이터를 불러오고 있습니다</p>
        </div>
        <!-- Screens will be injected here via JavaScript -->
        <div id="screenContent" class="w-full h-full flex flex-col hidden"></div>
    </div>
    
    <!-- Alert Modal -->
    <div id="alertModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-transform scale-95" id="alertBox">
            <h3 class="text-xl font-bold text-gray-900 mb-2" id="alertTitle">알림</h3>
            <p class="text-gray-600 mb-6 text-sm leading-relaxed whitespace-pre-wrap" id="alertMessage">메시지 내용</p>
            <button onclick="closeModal('alertModal')" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-md">확인</button>
        </div>
    </div>
    
    <!-- Input Modal (For requesting money) -->
    <div id="inputModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-transform scale-95" id="inputBox">
            <h3 class="text-xl font-bold text-gray-900 mb-2" id="inputTitle">용돈 신청</h3>
            <p class="text-gray-500 text-sm mb-4" id="inputMessage">신청할 금액을 입력해주세요.</p>
            <input type="number" id="inputValue" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mb-6 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold" placeholder="예: 1000">
            <div class="flex gap-3">
                <button onclick="closeModal('inputModal')" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition">취소</button>
                <button id="inputConfirmBtn" class="flex-1 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-md flex justify-center items-center">
                    <span id="inputConfirmText">신청하기</span>
                    <i id="inputConfirmLoader" class="fa-solid fa-spinner fa-spin hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Announcement Modal -->
    <div id="announcementModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-transform scale-95" id="announcementBox">
            <h3 class="text-xl font-bold text-gray-900 mb-2">새 공지사항 작성</h3>
            <p class="text-gray-500 text-sm mb-4">아이들 화면 상단에 고정될 메시지를 입력하세요.</p>
            <textarea id="announcementText" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium resize-none h-24 whitespace-pre-wrap" placeholder="예: 이번 주말은 특별 상점 2배 이벤트입니다!"></textarea>
            <div class="flex gap-3">
                <button onclick="closeModal('announcementModal')" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition">취소</button>
                <button onclick="submitAnnouncement()" class="flex-1 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-md flex justify-center items-center">
                    <span id="announcementBtnText">공지 등록</span>
                    <i id="announcementBtnLoader" class="fa-solid fa-spinner fa-spin hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Point Request Modal -->
    <div id="pointReqModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 hidden opacity-0 transition-opacity duration-300 px-4 overflow-y-auto">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-transform scale-95 my-auto" id="pointReqBox">
            <h3 class="text-xl font-bold text-gray-900 mb-1">독서 / 상점 신청</h3>
            <p class="text-gray-500 text-xs mb-4">내용과 인증샷을 올려 부모님께 확인받으세요.</p>
            
            <input type="hidden" id="reqLearnerId">
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5">어떤 활동인가요?</label>
                    <select id="reqItem" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-medium">
                        <option value="eng">영어 도서 (+2P)</option>
                        <option value="kor">한글 도서 (+1P)</option>
                        <option value="custom">기타 활동 (부모님 판단)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5">상세 내용 (책 제목 등)</label>
                    <input type="text" id="reqDetail" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-medium" placeholder="무엇을 읽었/했나요?">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5 flex justify-between items-center">
                        <span>인증샷 첨부 (선택)</span>
                    </label>
                    <div class="relative w-full h-32 bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center overflow-hidden cursor-pointer hover:bg-gray-200 transition" id="photoUploadContainer" onclick="document.getElementById('reqImage').click()">
                        <div id="photoPlaceholder" class="text-center">
                            <i class="fa-solid fa-camera text-2xl text-gray-400 mb-1"></i>
                            <p class="text-xs text-gray-500 font-bold">터치하여 사진 촬영/선택</p>
                        </div>
                        <img id="photoPreview" class="absolute inset-0 w-full h-full object-cover hidden">
                    </div>
                    <input type="file" id="reqImage" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('pointReqModal')" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition">취소</button>
                <button id="pointReqSubmitBtn" onclick="submitPointRequest()" class="flex-1 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-md flex justify-center items-center">
                    <span id="pointReqSubmitText">신청하기</span>
                    <i id="pointReqSubmitLoader" class="fa-solid fa-spinner fa-spin hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Image Viewer Modal -->
    <div id="imageViewerModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90 hidden opacity-0 transition-opacity duration-300">
        <div class="relative w-full h-full flex flex-col items-center justify-center p-4">
            <div class="absolute top-4 right-4 flex gap-4">
                <button id="downloadImageBtn" class="text-white text-2xl opacity-70 hover:opacity-100 p-2"><i class="fa-solid fa-download"></i></button>
                <button onclick="closeModal('imageViewerModal')" class="text-white text-3xl opacity-70 hover:opacity-100 p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <img id="fullImageViewer" src="" class="max-w-full max-h-full object-contain rounded-lg">
        </div>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-transform scale-95" id="passwordBox">
            <h3 class="text-xl font-bold text-gray-900 mb-2">관리자 인증</h3>
            <p class="text-gray-500 text-sm mb-4" id="passwordMessage">비밀번호를 입력해주세요. <br><span class="text-xs">(초기 비밀번호: 0000)</span></p>
            <input type="password" id="adminPasswordInput" onkeydown="if(event.key === 'Enter') verifyAdminPassword()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mb-6 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold tracking-widest text-center text-xl" placeholder="****" inputmode="numeric" pattern="[0-9]*">
            <div class="flex gap-3">
                <button onclick="closeModal('passwordModal')" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition">취소</button>
                <button onclick="verifyAdminPassword()" class="flex-1 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-md">확인</button>
            </div>
            <div class="mt-4 text-center">
                <button onclick="openFindPassword()" class="text-sm text-gray-400 hover:text-indigo-600 underline underline-offset-2 font-medium">비밀번호를 잊으셨나요?</button>
            </div>
        </div>
    </div>

    <!-- Find Password Modal (보안 질문 방식) -->
    <div id="findPasswordModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-transform scale-95" id="findPasswordBox">
            <h3 class="text-xl font-bold text-gray-900 mb-2">비밀번호 찾기</h3>
            <p class="text-gray-500 text-sm mb-4" id="findPasswordMessage">비밀번호를 확인하려면 아래 보안 질문의 정답을 입력해주세요.</p>
            
            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-4 text-center">
                <span id="displaySecurityQuestion" class="text-indigo-800 font-bold tracking-tight">Q. 우리의 신혼 여행지는?</span>
            </div>
            
            <input type="text" id="securityAnswerInput" onkeydown="if(event.key === 'Enter') verifySecurityAnswer()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mb-6 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-center text-lg" placeholder="정답 입력">
            
            <div class="flex gap-3">
                <button onclick="closeModal('findPasswordModal')" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition">취소</button>
                <button onclick="verifySecurityAnswer()" class="flex-1 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-md flex justify-center items-center">
                    <span id="resetPwText">확인</span>
                    <i id="resetPwLoader" class="fa-solid fa-spinner fa-spin hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Change Settings Modal -->
    <div id="changePasswordModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-transform scale-95" id="changePasswordBox">
            <h3 class="text-xl font-bold text-gray-900 mb-2">설정 변경</h3>
            <p class="text-gray-500 text-sm mb-4">관리자 비밀번호와 보안 질문을 변경합니다.</p>
            <div class="space-y-3 mb-6">
                <input type="password" id="currentPasswordInput" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="현재 비밀번호 (필수)">
                <input type="password" id="newPasswordInput" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="새 비밀번호 (4자리 이상 / 빈칸 시 유지)">
                
                <div class="pt-2 border-t border-gray-100">
                    <label class="block text-xs font-bold text-gray-500 mb-1">보안 질문 설정 (비밀번호 찾기용)</label>
                    <input type="text" id="newSecurityQuestionInput" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mb-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="새로운 보안 질문 (예: 우리의 신혼 여행지는?)">
                    <input type="text" id="newSecurityAnswerInput" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="보안 질문 정답 (예: 발리)">
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="closeModal('changePasswordModal')" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition">취소</button>
                <button onclick="changeAdminSettings()" class="flex-1 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-md flex justify-center items-center">
                    <span id="changePwText">저장하기</span>
                    <i id="changePwLoader" class="fa-solid fa-spinner fa-spin hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, addDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = 'soo-family-app';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDOimz28W-Qc5TlPha2ngqrqJHap6qlwCA",
            authDomain: "soo-family.firebaseapp.com",
            projectId: "soo-family",
            storageBucket: "soo-family.firebasestorage.app",
            messagingSenderId: "339270809643",
            appId: "1:339270809643:web:8a4075793358aa115dd26e",
            measurementId: "G-LR71YE2KRZ"
        };
        
        const basePath = `artifacts/${appId}/public/data`;
        
        let app, db, auth;
        let isLocalMode = false;
        
        // Global State
        window.state = {
            admin: { password: '0000', securityQuestion: '우리의 신혼 여행지는?', securityAnswer: '발리' },
            learners: {
                suweol: { id: 'suweol', name: '이수월', points: { englishBooks: 0, koreanBooks: 0, customPoints: 0, totalPoints: 0 }, coupons: { balance: 0, totalIssued: 0 } },
                suna: { id: 'suna', name: '이수나', points: { englishBooks: 0, koreanBooks: 0, customPoints: 0, totalPoints: 0 }, coupons: { balance: 0, totalIssued: 0 } }
            },
            history: [],
            requests: [],
            pointRequests: [],
            announcements: []
        };

        window.currentScreen = 'home';
        window.currentParams = {};
        window.currentUploadedImageBase64 = null;
        let currentAlertCallback = null;
        let isFirebaseLoaded = false;

        async function initFirebase() {
            if (!firebaseConfig || firebaseConfig.apiKey === "회원님의_API_KEY") {
                isLocalMode = true;
                showApp();
                return;
            }
            
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            try {
                await signInAnonymously(auth);
                await bootstrapData();
                setupRealtimeListeners();
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                showApp();
                setTimeout(() => {
                    window.showModal("임시 모드 알림", "클라우드 서버에 연결할 수 없어 임시 모드로 실행됩니다.<br><span class='text-xs text-rose-500'>(새로고침 시 데이터가 초기화됩니다)</span>");
                }, 500);
            }
        }

        async function bootstrapData() {
            if (!auth.currentUser) return;
            
            const adminRef = doc(db, `${basePath}/config/admin`);
            const adminSnap = await getDoc(adminRef);
            if (!adminSnap.exists()) {
                await setDoc(adminRef, window.state.admin);
            } else {
                window.state.admin = adminSnap.data();
            }

            const learnersRef = collection(db, `${basePath}/learners`);
            const learnersSnap = await getDocs(learnersRef);
            if (learnersSnap.empty) {
                await setDoc(doc(db, `${basePath}/learners/suweol`), window.state.learners.suweol);
                await setDoc(doc(db, `${basePath}/learners/suna`), window.state.learners.suna);
            }
        }

        function setupRealtimeListeners() {
            onSnapshot(doc(db, `${basePath}/config/admin`), (docSnap) => {
                if(docSnap.exists()) window.state.admin = docSnap.data();
            });

            onSnapshot(collection(db, `${basePath}/learners`), (snap) => {
                snap.docs.forEach(docSnap => { window.state.learners[docSnap.id] = docSnap.data(); });
                if (!isFirebaseLoaded) showApp(); else triggerRender();
            });

            onSnapshot(collection(db, `${basePath}/history`), (snap) => {
                window.state.history = snap.docs.map(d => ({ fbId: d.id, ...d.data() }));
                window.state.history.sort((a, b) => b.id.localeCompare(a.id));
                triggerRender();
            });

            onSnapshot(collection(db, `${basePath}/moneyRequests`), (snap) => {
                window.state.requests = snap.docs.map(d => ({ fbId: d.id, ...d.data() }));
                window.state.requests.sort((a, b) => b.id.localeCompare(a.id));
                triggerRender();
            });

            onSnapshot(collection(db, `${basePath}/pointRequests`), (snap) => {
                window.state.pointRequests = snap.docs.map(d => ({ fbId: d.id, ...d.data() }));
                window.state.pointRequests.sort((a, b) => b.id.localeCompare(a.id));
                triggerRender();
            });

            onSnapshot(collection(db, `${basePath}/announcements`), (snap) => {
                window.state.announcements = snap.docs.map(d => ({ fbId: d.id, ...d.data() }));
                window.state.announcements.sort((a, b) => b.id.localeCompare(a.id));
                triggerRender();
            });
        }

        function showApp() {
            isFirebaseLoaded = true;
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('screenContent').classList.remove('hidden');
            window.navigate('home');
        }

        function triggerRender() {
            if (!isFirebaseLoaded) return;
            const appDiv = document.getElementById('screenContent');
            const scrollPos = appDiv.firstElementChild ? appDiv.firstElementChild.scrollTop : 0;
            
            let html = '';
            const s = window.currentScreen;
            const p = window.currentParams;
            
            if (s === 'home') html = getHomeHTML();
            else if (s === 'admin') html = getAdminHTML();
            else if (s === 'adminHistory') html = getAdminHistoryHTML(p.learnerId);
            else if (s === 'addPoint') html = getAddPointHTML(p.learnerId);
            else if (s === 'learner') html = getLearnerHTML(p.learnerId);
            else if (s === 'readingList') html = getReadingListHTML(p.learnerId, p.fromAdmin);
            
            appDiv.innerHTML = html;
            
            if(appDiv.firstElementChild && scrollPos > 0) {
                appDiv.firstElementChild.scrollTop = scrollPos;
            }
        }

        window.showModal = function(title, message, callback = null) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerHTML = message;
            currentAlertCallback = callback;
            
            const modal = document.getElementById('alertModal');
            const box = document.getElementById('alertBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        };

        window.closeModal = function(modalId) {
            const modal = document.getElementById(modalId);
            const box = modal.querySelector('div.bg-white, div.relative');
            
            modal.classList.add('opacity-0');
            if (box && box.classList.contains('scale-100')) {
                box.classList.remove('scale-100');
                box.classList.add('scale-95');
            }
            
            setTimeout(() => {
                modal.classList.add('hidden');
                if (modalId === 'alertModal' && currentAlertCallback) {
                    currentAlertCallback();
                    currentAlertCallback = null;
                }
            }, 300);
        };

        window.openImageViewer = function(src) {

        window.revertHistoryRecord = async function(fbId, learnerId) {
            const h = window.state.history.find(r => r.fbId === fbId);
            if (!h) {
                window.showModal('알림', '이미 삭제되었거나 찾을 수 없는 내역입니다.');
                return;
            }
            
            if (!confirm(`[${h.item}] 내역을 정말 삭제하시겠습니까?\n관련 점수는 즉시 복구(차감)됩니다.`)) return;

            // 1. 낙관적 업데이트: 화면에서 즉시 내역 제거하여 체감 속도 0.1초 구현
            window.state.history = window.state.history.filter(r => r.fbId !== fbId);
            
            // 2. 점수 재계산 (정확한 단순 복구)
            const l = JSON.parse(JSON.stringify(window.state.learners[learnerId]));
            
            if (h.type === 'coupon') {
                l.coupons.balance -= h.amount;
                if (h.item === '쿠폰 발급 완료') l.coupons.totalIssued -= 1;
            } else if (h.type === 'use') {
                l.coupons.balance -= h.amount; // amount가 마이너스이므로 빼주면 플러스가 됨 (돈 복구)
            } else if (h.type === 'merit' || h.type === 'demerit') {
                l.points.totalPoints -= h.points; // 벌점(-2)을 빼면 +2가 되어 정상 복구됨
                if (h.item === '영어 도서') l.points.englishBooks -= 1;
                else if (h.item === '한글 도서') l.points.koreanBooks -= 1;

        window.processAddPoint = async function(learnerId, category, item, detail, date, customPointsValue, image = null) {
            if (!detail) {
                window.showModal('입력 오류', '상세 내용을 반드시 입력해주세요.');
                return false;
            }

            let pointsToAdd = 0;
            let pointTypeKey = ''; 
            let logItemName = '';

            if (category === 'merit') {
                if (item === 'eng') { pointsToAdd = 2; pointTypeKey = 'englishBooks'; logItemName = '영어 도서'; }
                else if (item === 'kor') { pointsToAdd = 1; pointTypeKey = 'koreanBooks'; logItemName = '한글 도서'; }
                else if (item === 'custom') { 
                    pointsToAdd = customPointsValue;
                    if (pointsToAdd <= 0) { window.showModal('입력 오류', '기타 상점은 1 이상의 숫자를 입력하세요.'); return false; }
                    pointTypeKey = 'customPoints'; logItemName = '기타 활동'; 
                }
            } else { 
                if (item === 'cleanup') { pointsToAdd = -1; logItemName = '정리'; }
                else if (item === 'hw') { pointsToAdd = -2; logItemName = '숙제 미션'; }
                else if (item === 'custom') { 
                    if (customPointsValue <= 0) { window.showModal('입력 오류', '기타 벌점은 1 이상의 숫자를 입력하세요.'); return false; }
                    pointsToAdd = -customPointsValue; logItemName = '기타 벌점'; 
                }
            }

            const l = JSON.parse(JSON.stringify(window.state.learners[learnerId]));
            l.points.totalPoints += pointsToAdd;
            if (pointTypeKey === 'englishBooks' || pointTypeKey === 'koreanBooks') {
                l.points[pointTypeKey] += 1;
            } else if (pointTypeKey === 'customPoints') {
                l.points[pointTypeKey] += pointsToAdd;
            }

            const historyRecords = [];
            
            // 낙관적 UI 작동 시 삭제 버그 방지를 위한 문서 ID 사전 생성
            const mainRecordId = isLocalMode ? Date.now().toString() : doc(collection(db, `${basePath}/history`)).id;
            
            historyRecords.push({
                id: Date.now().toString(),
                fbId: mainRecordId,
                learnerId: learnerId,
                date: date,
                type: category,
                item: logItemName,
                points: pointsToAdd,
                detail: detail,
                image: image
            });

            const { updatedLearner, newHistories, msg } = window.calculateCoupons(l, learnerId);
            if (newHistories.length > 0) {
                newHistories.forEach(nh => {
                    nh.fbId = isLocalMode ? nh.id : doc(collection(db, `${basePath}/history`)).id;
                    historyRecords.push(nh);
                });
            }

            // 낙관적 UI 업데이트 (백그라운드 통신 전 화면 즉시 렌더링)
            window.state.learners[learnerId] = updatedLearner;
            for(const record of historyRecords) {
                window.state.history.unshift(record);
            }
            triggerRender(); 

            try {
                if (!isLocalMode) {
                    const batch = writeBatch(db);
                    batch.update(doc(db, `${basePath}/learners`, learnerId), {
                        points: updatedLearner.points,
                        coupons: updatedLearner.coupons
                    });
                    
                    for(const record of historyRecords) {
                        batch.set(doc(db, `${basePath}/history`, record.fbId), record);
                    }
                    await batch.commit();
                }

                let finalMsg = `<b>${updatedLearner.name}</b>에게 처리되었습니다.`;
                if (msg) finalMsg += '<br><br>' + msg; 
                
                // 모달 띄우지 않고 자연스럽게 진행 (사용성 개선)
                // window.showModal('처리 완료', finalMsg);
                
                return true;
            } catch(e) {
                console.error(e);
                window.showModal('오류', '데이터 저장 중 문제가 발생했습니다.');
                return false;
            }
        };

        window.calculateCoupons = function(l, learnerId) {
            let issuedCount = 0;
            let messages = [];
            let gotSpecial = false;
            let newHistories = [];

            if (learnerId === 'suweol') {
                while (l.points.totalPoints >= 10 && l.points.englishBooks >= 3) {
                    l.coupons.balance += 2000;
                    l.coupons.totalIssued += 1;
                    issuedCount++;
                    
                    l.points.totalPoints -= 10;
                    l.points.englishBooks -= 3;
                    
                    let pointsToDeduct = 4;
                    while(pointsToDeduct > 0) {
                        if (l.points.koreanBooks > 0) { l.points.koreanBooks--; pointsToDeduct -= 1; }
                        else if (l.points.customPoints > 0) { l.points.customPoints--; pointsToDeduct -= 1; }
                        else if (l.points.englishBooks > 0) { 
                            l.points.englishBooks--; pointsToDeduct -= 2; 
                            if (pointsToDeduct < 0) { l.points.customPoints += 1; pointsToDeduct = 0; }
                        } else { l.points.customPoints -= pointsToDeduct; pointsToDeduct = 0; }
                    }
                }
                if (issuedCount > 0) {
                    messages.push(`🎉 <b>축하합니다!</b><br>조건을 달성하여 2,000원 쿠폰이 ${issuedCount}장 발급되었습니다!<br><span class="text-xs text-indigo-600">(남은 이월 포인트는 유지됩니다)</span>`);
                }
            } else if (learnerId === 'suna') {
                while (l.points.totalPoints >= 10) {
                    l.coupons.balance += 2000;
                    l.coupons.totalIssued += 1;
                    issuedCount++;
                    l.points.totalPoints -= 10;
                    
                    let pointsToDeduct = 10;
                    while(pointsToDeduct > 0) {
                        if (l.points.englishBooks > 0 && pointsToDeduct >= 2) { l.points.englishBooks--; pointsToDeduct -= 2; }
                        else if (l.points.koreanBooks > 0) { l.points.koreanBooks--; pointsToDeduct -= 1; }
                        else if (l.points.customPoints > 0) { l.points.customPoints--; pointsToDeduct -= 1; }
                        else if (l.points.englishBooks > 0) { l.points.englishBooks--; l.points.customPoints += 1; pointsToDeduct = 0; }
                        else { l.points.customPoints -= pointsToDeduct; pointsToDeduct = 0; }
                    }

                    if (l.coupons.totalIssued === 3) {
                        l.coupons.balance += 2000;
                        gotSpecial = true;
                    }
                }
                
                if (issuedCount > 0) {
                    messages.push(`🎉 <b>축하합니다!</b><br>10포인트를 달성하여 2,000원 쿠폰이 ${issuedCount}장 발급되었습니다!`);
                    if (gotSpecial) messages.push("🎁 <b>특별 미션 달성!</b><br>누적 3번 쿠폰 발급으로 특별 쿠폰 2,000원이 추가 지급되었습니다!");
                }
            }

            if (issuedCount > 0) {
                for(let i=0; i<issuedCount; i++) {
                    newHistories.push({
                        id: Date.now().toString() + i, learnerId: learnerId, date: new Date().toISOString().split('T')[0],
                        type: 'coupon', item: '쿠폰 발급 완료', points: 0, amount: 2000, detail: '목표 달성 자동 발급'
                    });
                }
                if (gotSpecial) {
                     newHistories.push({
                        id: Date.now().toString() + 'sp', learnerId: learnerId, date: new Date().toISOString().split('T')[0],
                        type: 'coupon', item: '특별 쿠폰 발급', points: 0, amount: 2000, detail: '누적 3회 달성 보너스'
                    });
                }
            }
            return { updatedLearner: l, newHistories, msg: messages.join('<br><br>') };
        };

                csvContent += `${index + 1},${dateStr},${typeName},${h.item},${val},"${detailStr}",${hasPhoto}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

                    id, name, points: { englishBooks: 0, koreanBooks: 0, customPoints: 0, totalPoints: 0 }, coupons: { balance: 0, totalIssued: 0 }
                });
                const suweol = emptyLearner('suweol', '이수월');
                const suna = emptyLearner('suna', '이수나');

                if (!isLocalMode) {
                    await updateDoc(doc(db, `${basePath}/learners`, 'suweol'), suweol);
                    await updateDoc(doc(db, `${basePath}/learners`, 'suna'), suna);

                    const histSnap = await getDocs(collection(db, `${basePath}/history`));
                    histSnap.forEach(d => deleteDoc(doc(db, `${basePath}/history`, d.id)));
                    
                    const prSnap = await getDocs(collection(db, `${basePath}/pointRequests`));
                    prSnap.forEach(d => deleteDoc(doc(db, `${basePath}/pointRequests`, d.id)));
                    
                    const mrSnap = await getDocs(collection(db, `${basePath}/moneyRequests`));
                    mrSnap.forEach(d => deleteDoc(doc(db, `${basePath}/moneyRequests`, d.id)));
                } else {
                    window.state.learners.suweol = suweol;
                    window.state.learners.suna = suna;
                    window.state.history = [];
                    window.state.pointRequests = [];
                    window.state.requests = [];
                }
                
                window.showModal('데이터 초기화 완료', '모든 앱 데이터가 처음 상태로 깨끗하게 초기화되었습니다.');
                window.navigate('admin');
            } catch(e) {
                console.error(e);
                window.showModal('오류', '초기화 중 문제가 발생했습니다.');
            }
        };

        window.openPointReqModal = function(learnerId) {
            document.getElementById('reqLearnerId').value = learnerId;
            document.getElementById('reqDetail').value = '';
            document.getElementById('reqImage').value = '';
            window.currentUploadedImageBase64 = null;
            document.getElementById('photoPreview').src = '';
            document.getElementById('photoPreview').classList.add('hidden');
            document.getElementById('photoPlaceholder').classList.remove('hidden');

            const modal = document.getElementById('pointReqModal');
            const box = document.getElementById('pointReqBox');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);
        }

        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; const MAX_HEIGHT = 600;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    
                    if(dataUrl.length > 500000) {
                         window.showModal("알림", "이미지 용량이 너무 큽니다. 다른 사진을 선택해주세요.");
                         return;
                    }
                    window.currentUploadedImageBase64 = dataUrl;
                    const preview = document.getElementById('photoPreview');
                    preview.src = dataUrl;
                    preview.classList.remove('hidden');
                    document.getElementById('photoPlaceholder').classList.add('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        };

        // 관리자 인증 설정 등
        window.openAdminAuth = function() {
            document.getElementById('adminPasswordInput').value = '';
            const modal = document.getElementById('passwordModal');
            const box = document.getElementById('passwordBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
                document.getElementById('adminPasswordInput').focus();
            }, 10);
        };

        window.verifyAdminPassword = function() {
            const inputPw = document.getElementById('adminPasswordInput').value;
            const currentPw = window.state.admin.password;
            
            if (inputPw === currentPw) {
                sessionStorage.setItem('adminAuthed', 'true');
                window.closeModal('passwordModal');
                setTimeout(() => window.navigate('admin'), 300);
            } else {
                window.showModal('인증 실패', '비밀번호가 일치하지 않습니다.');
                document.getElementById('adminPasswordInput').value = '';
            }
        };

        window.openFindPassword = function() {
            window.closeModal('passwordModal');
            setTimeout(() => {
                document.getElementById('securityAnswerInput').value = '';
                const currentQuestion = window.state.admin.securityQuestion || '우리의 신혼 여행지는?';
                document.getElementById('displaySecurityQuestion').innerText = `Q. ${currentQuestion}`;
                const modal = document.getElementById('findPasswordModal');
                const box = document.getElementById('findPasswordBox');
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    box.classList.remove('scale-95');
                    box.classList.add('scale-100');
                    document.getElementById('securityAnswerInput').focus();
                }, 10);
            }, 300);
        };

        window.verifySecurityAnswer = async function() {
            const answer = document.getElementById('securityAnswerInput').value.trim();
            const expectedAnswer = window.state.admin.securityAnswer || "발리";
            if (answer !== expectedAnswer) {
                window.showModal('오류', '정답이 일치하지 않습니다. 다시 시도해주세요.');
                return;
            }
            const currentPw = window.state.admin.password;
            window.closeModal('findPasswordModal');
            setTimeout(() => {
                window.showModal('정답입니다!', `현재 관리자 비밀번호는 <br><br><span class="text-2xl font-black text-indigo-600 tracking-widest">[ ${currentPw} ]</span><br><br> 입니다.`, () => window.openAdminAuth());
            }, 300);
        };

        window.openChangePassword = function() {
            document.getElementById('currentPasswordInput').value = '';
            document.getElementById('newPasswordInput').value = '';
            document.getElementById('newSecurityQuestionInput').value = window.state.admin.securityQuestion || '우리의 신혼 여행지는?';
            document.getElementById('newSecurityAnswerInput').value = window.state.admin.securityAnswer || '발리';
            const modal = document.getElementById('changePasswordModal');
            const box = document.getElementById('changePasswordBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        };

        window.changeAdminSettings = async function() {
            const curPw = document.getElementById('currentPasswordInput').value;
            const newPw = document.getElementById('newPasswordInput').value;
            const newQ = document.getElementById('newSecurityQuestionInput').value.trim();
            const newA = document.getElementById('newSecurityAnswerInput').value.trim();

            if (curPw !== window.state.admin.password) return window.showModal('오류', '현재 비밀번호가 일치하지 않습니다.');
            if (newPw && newPw.length < 4) return window.showModal('오류', '새 비밀번호는 4자리 이상이어야 합니다.');
            if (!newQ || !newA) return window.showModal('오류', '보안 질문과 정답을 비워둘 수 없습니다.');

            const finalPw = newPw || curPw; 
            const btnText = document.getElementById('changePwText');
            const btnLoader = document.getElementById('changePwLoader');
            btnText.classList.add('hidden'); btnLoader.classList.remove('hidden');

            try {
                const newData = { password: finalPw, securityQuestion: newQ, securityAnswer: newA };
                if (!isLocalMode) await updateDoc(doc(db, `${basePath}/config/admin`), newData);
                else window.state.admin = { ...window.state.admin, ...newData };
                
                window.closeModal('changePasswordModal');
                setTimeout(() => window.showModal('변경 완료', '설정이 성공적으로 변경 및 저장되었습니다.'), 300);
            } catch(e) {
                console.error(e);
            } finally {
                btnText.classList.remove('hidden'); btnLoader.classList.add('hidden');
            }
        };

        // Start App
        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
        });
    </script>
</body>
</html>
